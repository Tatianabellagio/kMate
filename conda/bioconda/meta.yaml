{% set name = "kmate" %}
{% set version = "0.1.5" %}

# Bioconda recipe for kMate (recipes/kmate/meta.yaml upstream). Fetches the PyPI
# sdist, NOT the GitHub auto-tarball, which archives the whole ~185 MB repo.

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 7a5e103640af12000ce563d529b967a42403594abf22900ef4590138dea55dd7

build:
  noarch: python                       # pure-Python -> one build, no platform matrix
  number: 0
  run_exports:                         # bioconda lint: pin downstream deps (0.x -> max_pin x.x)
    - {{ pin_subpackage('kmate', max_pin="x.x") }}
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - kmate = kmate.cli:main

requirements:
  host:
    - python >=3.9
    - pip
    - setuptools >=61
  run:
    # No Python cap: since 0.1.5 kMate uses only the `jellyfish` program, not the
    # dna_jellyfish bindings (bioconda ships those for Python 3.9-3.12 only).
    - python >=3.9
    - numpy
    - scipy
    - pysam
    - kmer-jellyfish >=2.3.1           # k-mer counter (the binary) -- NOT `jellyfish`,
                                       # which on conda-forge is a Python string-similarity
                                       # library and ships no `jellyfish` binary.
    - samtools                         # BAM read access
    - bcftools                         # decompose / haploidize (panel VCF prep)

test:
  imports:
    - kmate
  commands:
    - kmate --help
    - kmate --version
    # End-to-end: exercises jellyfish/samtools, so a missing or wrong binary
    # dependency fails CI instead of shipping a package that cannot count k-mers.
    - kmate selftest

about:
  home: https://github.com/Tatianabellagio/kMate
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: k-mer-based founder-mixture frequency estimation for pool-seq
  description: |
    kMate estimates per-founder mixture proportions (h) in a sequenced pool from
    canonical k-mer counts against a pangenome founder x k-mer matrix, then
    projects to per-record allele frequencies for SNPs, indels and SVs in one
    pass. Fits one mixture per chromosome (inbred/selfing pools) or per window
    (recombinant pools), and builds its founder matrices from a pangenome VCF.
    `kmate selftest` verifies an install on a bundled fixture.
  dev_url: https://github.com/Tatianabellagio/kMate

extra:
  recipe-maintainers:
    - Tatianabellagio
